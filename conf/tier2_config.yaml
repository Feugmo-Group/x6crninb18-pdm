# Tier-2 spatial HTW_PDM (T2-B steady / T2-C transient) - X6CrNiNb18-10 barrier layer.
# physics.* = the Tier-1 M4 kinetics (identified); transport constants and Robin
# ratios are ASSUMED and live in src/tier2_physics.py (see its docstring).

physics:
  A_bl: 0.7269      # nm/h (M4)
  b3: -0.01249      # 1/nm
  C_bl: 0.0
  PBR_eff: 1.096
  C_x: 0.0
  L0: 1.924         # nm
  L_ol0: 115.6      # nm

domain:
  Nx: 24            # spatial GLL nodes on xi in [0, 1]
  alpha_x: 0.0      # uniform GLL (Pe ~ 10-14: mild boundary layers)
  t_h: 480.0        # T2-B geometry: L_bl at this exposure
  # T2-C transient:
  Nt: 16
  alpha_t: 1.5
  mapping_t: log
  yf: 1.0           # unit tau window (rescaled to [tau0, 1] in the trainer)
  tau0: 0.05        # start of the transient window (tau = t/480 h)

model:
  hidden_dim: 32
  n_layers: 3
  backbone: mlp
  poly_degree: 4

train:
  seed: 0
  dtype: float64
  n_pretrain: 500
  pretrain_lr: 1.0e-2
  n_adam: 2000
  adam_lr: 1.0e-3
  n_lbfgs: 3
  lbfgs_max_iter: 400
  lbfgs_tol_grad: 1.0e-13
  lbfgs_tol_change: 1.0e-15
  lambda_ic: 10.0
  grad_clip: 0

output:
  dir: outputs/tier2
  log_every: 200
